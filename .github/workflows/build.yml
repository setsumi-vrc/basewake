name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: basewake-windows-x64
            files: |
              target/release/basewake.exe
              target/release/basewakectl.exe
              target/release/openvr_api.dll
          - os: ubuntu-latest
            name: basewake-linux-x64
            files: |
              target/release/basewake
              target/release/basewakectl
              target/release/libopenvr_api.so
          - os: macos-latest
            name: basewake-macos-arm64
            files: |
              target/release/basewake
              target/release/basewakectl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}
