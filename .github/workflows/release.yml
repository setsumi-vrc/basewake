name: release

# Push a tag like v0.1.0 to build all three systems and publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release
      - run: cargo build --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "Basewake-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/basewake.exe, target/release/basewakectl.exe, target/release/openvr_api.dll, install.ps1, README.md, CHANGELOG.md, LICENSE $name
          Copy-Item third_party/openvr-2.12.14/LICENSE "$name/openvr_api.LICENSE.txt"
          Compress-Archive $name "$name.zip"
          "ASSET=$name.zip" >> $env:GITHUB_ENV

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          name="Basewake-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/basewake target/release/basewakectl README.md CHANGELOG.md LICENSE "$name"/
          if [ -f target/release/libopenvr_api.so ]; then
            cp target/release/libopenvr_api.so "$name"/
            cp third_party/openvr-2.12.14/LICENSE "$name/openvr_api.LICENSE.txt"
          fi
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \[" v "\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
