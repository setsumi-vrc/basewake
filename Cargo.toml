[package]
name = "basewake"
version = "0.1.0"
edition = "2024"
description = "Wakes Valve Lighthouse V2 base stations with SteamVR and puts them to sleep when it closes"
license = "MIT"
repository = "https://github.com/setsumi-vrc/basewake"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui_glow = "0.37.0"
glow = "0.17"
libloading = "0.9.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = "0.26.1"
windows = { version = "0.62.2", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Devices_Bluetooth_Advertisement", "Devices_Enumeration", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_UI_Shell", "Win32_Graphics_OpenGL", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
